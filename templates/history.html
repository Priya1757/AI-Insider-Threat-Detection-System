<!DOCTYPE html>
<html>
<head>

<title>Threat History</title>

<style>

body{
background:#0d1117;
color:white;
font-family:Arial;
text-align:center;
}

nav{
margin:20px;
}

nav a{
color:cyan;
margin:15px;
text-decoration:none;
font-size:20px;
font-weight:bold;
}

table{
width:90%;
margin:auto;
margin-top:20px;
border-collapse:collapse;
background:#161b22;
}

th,td{
border:1px solid gray;
padding:12px;
}

th{
background:cyan;
color:black;
}

</style>

</head>

<body><body>

<nav>
    <a href="{{ url_for('dashboard') }}">Dashboard</a>
    <a href="{{ url_for('analysis') }}">Insider Analysis</a>
    <a href="{{ url_for('history') }}">Threat History</a>
    <a href="{{ url_for('logout') }}">Logout</a>
</nav>

<h1>Threat History</h1>

<form method="POST">
<input type="text"
name="search"
placeholder="Search Employee">

<button type="submit">Search</button>
</form>

<table>

<tr>
<th>ID</th>
<th>Employee</th>
<th>Login Hour</th>
<th>Files</th>
<th>USB</th>
<th>Status</th>
<th>Risk</th>
</tr>

{% for row in data %}

<tr>
<td>{{ row[0] }}</td>
<td>{{ row[1] }}</td>
<td>{{ row[2] }}</td>
<td>{{ row[3] }}</td>
<td>{{ row[4] }}</td>
<td>{{ row[5] }}</td>
<td>{{ row[6] }}%</td>
</tr>

{% endfor %}

</table>

</body>
</html>
