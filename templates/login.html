<!DOCTYPE html>
<html>
<head>

<title>SOC Login</title>

<style>

body{
background:#0d1117;
font-family:Arial;
text-align:center;
color:white;
}

.login-box{
width:400px;
margin:auto;
margin-top:120px;
background:#161b22;
padding:30px;
border-radius:15px;
box-shadow:0 0 20px cyan;
}

input{
width:90%;
padding:12px;
margin:10px;
border:none;
border-radius:8px;
}

button{
padding:12px 25px;
background:cyan;
border:none;
border-radius:8px;
}

.error{
color:red;
}

</style>
</head>

<body>

<div class="login-box">

<h1>AI SOC Login</h1>

<form method="POST">

<input type="text"
name="username"
placeholder="Username"
required>

<input type="password"
name="password"
placeholder="Password"
required>

<button type="submit">
Login
</button>

</form>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

</div>

</body>
</html>
