<!DOCTYPE html>
<html>

<head>

    <title>AI SOC Login</title>

    <style>

        body{
            background-color:#0d1117;
            font-family:Arial, sans-serif;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }

        .login-box{
            width:400px;
            background:#161b22;
            padding:40px;
            border-radius:15px;
            text-align:center;
            box-shadow:0px 0px 25px cyan;
        }

        h1{
            color:cyan;
            margin-bottom:10px;
        }

        h3{
            color:#9ca3af;
            margin-bottom:30px;
        }

        input{
            width:90%;
            padding:12px;
            margin:10px 0;
            border:none;
            border-radius:8px;
            background:#0d1117;
            color:white;
            font-size:16px;
        }

        button{
            width:95%;
            padding:12px;
            background:cyan;
            border:none;
            border-radius:8px;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
        }

        button:hover{
            background:#00ffffaa;
        }

        .error{
            color:red;
            margin-top:15px;
            font-weight:bold;
        }

        .footer{
            margin-top:20px;
            font-size:12px;
            color:gray;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h1>🛡 AI SOC Portal</h1>

        <h3>Security Operations Center</h3>

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Manager Username"
                required>

            <input
                type="password"
                name="password"
                placeholder="Password"
                required>

            <br><br>

            <button type="submit">
                LOGIN
            </button>

        </form>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <div class="footer">
            AI Insider Threat Detection System<br>
            Authorized Personnel Only
        </div>

    </div>

</body>

</html>
